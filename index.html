<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>无尽进化</title>
<style>
  body { background: #0b0f19; color: #e2e8f0; margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
  .hud { position: fixed; top: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.8); z-index: 100; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
  #gearIcon { cursor: pointer; font-size: 18px; color: #888; padding-right: 10px;}
  #map-wrap { position: absolute; top: 50px; left: 0; width: 100vw; height: calc(100vh - 50px); overflow: hidden; touch-action: none; }
  #map { position: absolute; width: 4000px; height: 4000px; background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 40px 40px; transform-origin: 0 0; }
  #lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  
  .node { position: absolute; width: 130px; padding: 10px; background: #161b22; border: 2px solid #30363d; border-radius: 10px; text-align: center; font-size: 12px; transform: translate(-50%,-50%); transition: 0.2s; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center;}
  .node.can { border-color: #10b981; box-shadow: 0 0 10px #10b981; cursor: pointer; }
  .node.lock { opacity: 0.4; }
  .node.max { border-color: #fbbf24; background: #1e1b10;}
  
  .n-title { font-weight: bold; color: #fff; margin-bottom: 4px; font-size: 13px;}
  .n-lvl { font-size: 11px; color: #d2a8ff; margin-bottom: 4px;}
  .n-cost { color: #3fb950; font-weight: bold; }
  .n-req { font-size: 10px; color: #ef4444; margin-top: 4px; line-height: 1.2;}
  
  #settingsPanel { display: none; position: fixed; top: 50px; left: 50%; transform: translateX(-50%); width: 280px; background: #1a1a1a; border: 1px solid #444; padding: 20px; border-radius: 12px; z-index: 200; color: #ccc; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);}
  .setting-row { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
  .setting-row input[type="range"] { width: 100px; accent-color: #10b981; }
  .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 18px; color: #888;}
  
  #sysTitle { font-weight: bold; margin-bottom: 20px; color: #fff; display: inline-block; cursor: default;}
  
  #advancedGraphics { display: none; margin-top: 15px; border-top: 1px dashed #333; padding-top: 15px; color: #888; font-size: 12px;}
  .adv-input { background: #000; border: 1px solid #222; color: #10b981; padding: 2px 5px; width: 50px; border-radius: 4px; outline: none; }
</style>
</head>
<body>
<div class="hud">
  <div id="dnaIndex" style="padding: 5px;">DNA: <span id="dnaDisplay">15</span></div>
  <div id="gearIcon">⚙️</div>
</div>

<div id="map-wrap">
  <div id="map"><svg id="lines"></svg></div>
</div>

<div id="settingsPanel">
  <div class="close-btn" onclick="document.getElementById('settingsPanel').style.display='none'">✖</div>
  <div id="sysTitle">游戏设置</div>
  <div class="setting-row">
    <label>背景音乐</label>
    <input type="range" min="0" max="100" value="50">
  </div>
  <div class="setting-row">
    <label>极简渲染模式</label>
    <input type="checkbox">
  </div>
  <div class="setting-row">
    <label>云端存档同步</label>
    <input type="checkbox" checked>
  </div>

  <div id="advancedGraphics">
    <div class="setting-row">
      <label>关闭能耗保护限制</label>
      <input type="checkbox" id="setPower" onchange="applyGraphics()">
    </div>
    <div class="setting-row">
      <label>开启节点预渲染</label>
      <input type="checkbox" id="setRender" onchange="applyGraphics()">
    </div>
    <div class="setting-row">
      <label>渲染倍率 (Hz)</label>
      <input type="number" id="setFps" class="adv-input" value="1" onchange="applyGraphics()">
    </div>
  </div>
</div>

<script src="nodes.js"></script>
<script>
  let dnaAmount = 15; 
  let isPowerSaving = false; 
  let autoRenderReady = false; 
  let animationFrameRate = 1;
  let _t1 = null, _t2 = null;
  let isVerified = false;
  let isLocked = false;
  
  const map = document.getElementById('map');
  const mapWrap = document.getElementById('map-wrap');
  const svg = document.getElementById('lines');
  const dnaLabel = document.getElementById('dnaDisplay');

  NODES.forEach(n => { 
    n.level = 0; 
    n.children = [];
  });

  NODES.forEach(n => {
    if (n.req) {
      n.req.forEach(r => {
        let parent = NODES.find(p => p.id === r.id);
        if (parent) parent.children.push(n);
      });
    }
  });

  let rootNodes = NODES.filter(n => !n.req || n.req.length === 0);
  let queue = rootNodes.map(n => ({ node: n, depth: 0 }));
  let visited = new Set();

  while (queue.length > 0) {
    let { node, depth } = queue.shift();
    if (visited.has(node.id)) continue;
    visited.add(node.id);
    node.depth = depth;
    
    node.children.forEach(child => {
      if (!visited.has(child.id)) {
        queue.push({ node: child, depth: depth + 1 });
      }
    });
  }

  NODES.forEach(n => { if (n.depth === undefined) n.depth = 0; });

  let depthGroups = {};
  NODES.forEach(n => {
    if (!depthGroups[n.depth]) depthGroups[n.depth] = [];
    depthGroups[n.depth].push(n);
  });

  let gapY = 200;
  let gapX = 180;
  let maxWidth = 0;

  for (let d in depthGroups) {
    let list = depthGroups[d];
    let rowWidth = list.length * gapX;
    if (rowWidth > maxWidth) maxWidth = rowWidth;
    
    let startX = -rowWidth / 2 + gapX / 2;
    list.forEach((n, i) => {
      n.x = startX + i * gapX;
      n.y = d * gapY;
    });
  }

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  NODES.forEach(n => {
    if(n.x < minX) minX = n.x;
    if(n.x > maxX) maxX = n.x;
    if(n.y < minY) minY = n.y;
    if(n.y > maxY) maxY = n.y;
  });

  let offsetX = 0, offsetY = 0, scale = 0.7;
  let startX = 0, startY = 0, isDragging = false;

  function centerView() {
    let cx = (minX + maxX) / 2;
    let cy = (minY + maxY) / 2;
    offsetX = window.innerWidth / 2 - cx * scale;
    offsetY = window.innerHeight / 2 - cy * scale - 50;
    map.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  }

  mapWrap.addEventListener('pointerdown', (e) => {
    if(e.target.closest('.node')) return;
    isDragging = true;
    startX = e.clientX - offsetX;
    startY = e.clientY - offsetY;
  });

  mapWrap.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    offsetX = e.clientX - startX;
    offsetY = e.clientY - startY;
    map.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  });

  mapWrap.addEventListener('pointerup', () => isDragging = false);
  mapWrap.addEventListener('pointerleave', () => isDragging = false);

  document.getElementById('gearIcon').onclick = () => {
    document.getElementById('settingsPanel').style.display = 'block';
  };

  document.getElementById('dnaIndex').addEventListener('pointerdown', () => {
    if (isLocked) return;
    _t1 = setTimeout(() => {
      let _v = prompt("请输入底层调试参数:");
      if (_v === '5201314a') {
        isVerified = true;
      } else {
        isLocked = true;
      }
    }, 1500);
  });

  document.getElementById('dnaIndex').addEventListener('pointerup', () => clearTimeout(_t1));
  document.getElementById('dnaIndex').addEventListener('pointerleave', () => clearTimeout(_t1));

  document.getElementById('sysTitle').addEventListener('pointerdown', () => {
    if (!isVerified) return;
    _t2 = setTimeout(() => {
      document.getElementById('advancedGraphics').style.display = 'block';
      isVerified = false; 
    }, 3000);
  });

  document.getElementById('sysTitle').addEventListener('pointerup', () => clearTimeout(_t2));
  document.getElementById('sysTitle').addEventListener('pointerleave', () => clearTimeout(_t2));

  function applyGraphics() {
    isPowerSaving = document.getElementById('setPower').checked;
    autoRenderReady = document.getElementById('setRender').checked;
    animationFrameRate = parseInt(document.getElementById('setFps').value) || 1;
    updateRender();
  }

  function isUnlocked(node) {
    if (!node.req || node.req.length === 0) return true;
    return node.req.every(r => {
      let rn = NODES.find(n => n.id === r.id);
      if (!rn) return false;
      if (r.lv === 'MAX') return rn.level >= rn.maxLv;
      return rn.level >= r.lv;
    });
  }

  NODES.forEach(node => {
    let nodeElement = document.createElement('div');
    nodeElement.className = 'node lock';
    nodeElement.id = 'node-' + node.id;
    nodeElement.style.left = node.x + 'px';
    nodeElement.style.top = node.y + 'px';
    nodeElement.innerHTML = `
      <div class="n-title">${node.name}</div>
      <div class="n-lvl" id="lvl-${node.id}">0/${node.maxLv}</div>
      <div class="n-cost" id="cost-${node.id}">${node.baseCost}</div>
      <div class="n-req" id="req-${node.id}"></div>
    `;
    
    nodeElement.onclick = () => {
      if (isUnlocked(node) && node.level < node.maxLv) {
        let cost = Math.floor((node.baseCost || 10) * Math.pow(node.costMult || 1.15, node.level));
        if (isPowerSaving || dnaAmount >= cost) {
          if (!isPowerSaving) dnaAmount -= cost;
          node.level++;
          updateRender();
        }
      }
    };
    map.appendChild(nodeElement);

    if (node.req) {
      node.req.forEach(r => {
        let rn = NODES.find(n => n.id === r.id);
        if (!rn) return;
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', rn.x);
        line.setAttribute('y1', rn.y);
        line.setAttribute('x2', node.x);
        line.setAttribute('y2', node.y);
        line.setAttribute('stroke', '#30363d');
        line.setAttribute('stroke-width', '3');
        line.id = `line-${r.id}-${node.id}`;
        svg.appendChild(line);
      });
    }
  });

  function updateRender() {
    dnaLabel.innerText = isPowerSaving ? "∞" : Math.floor(dnaAmount);
    
    NODES.forEach(node => {
      let div = document.getElementById('node-' + node.id);
      if (!div) return;
      
      document.getElementById('lvl-' + node.id).innerText = `${node.level || 0}/${node.maxLv || 15}`;
      
      let cost = Math.floor((node.baseCost || 10) * Math.pow(node.costMult || 1.15, node.level || 0));
      document.getElementById('cost-' + node.id).innerText = node.level >= node.maxLv ? "MAX" : (isPowerSaving ? "∞" : cost);
      
      let unlocked = isUnlocked(node);
      
      if (node.req && !unlocked) {
        let reqTexts = node.req.map(r => {
          let rn = NODES.find(n => n.id === r.id);
          return `${rn ? rn.name : '未知'} ${r.lv === 'MAX' ? '满级' : 'Lv.'+r.lv}`;
        });
        document.getElementById('req-' + node.id).innerText = "需: " + reqTexts.join(" & ");
      } else {
        document.getElementById('req-' + node.id).innerText = "";
      }

      div.className = 'node';
      if (node.level >= node.maxLv) div.classList.add('max');
      else if (!unlocked) div.classList.add('lock');
      else {
        if (isPowerSaving || dnaAmount >= cost) div.classList.add('can');
      }

      if (node.req) {
        node.req.forEach(r => {
          let line = document.getElementById(`line-${r.id}-${node.id}`);
          if (line) {
            let rn = NODES.find(n => n.id === r.id);
            if (rn) {
              let met = r.lv === 'MAX' ? rn.level >= rn.maxLv : rn.level >= r.lv;
              line.setAttribute('stroke', met ? '#10b981' : '#30363d');
            }
          }
        });
      }
    });
  }

  setInterval(() => { 
    if(!isPowerSaving) { 
      dnaAmount += (5 * animationFrameRate); 
    } 
    if (autoRenderReady) {
      NODES.forEach(node => {
        if (node.level < node.maxLv && isUnlocked(node)) {
          let cost = Math.floor((node.baseCost || 10) * Math.pow(node.costMult || 1.15, node.level || 0));
          if (isPowerSaving || dnaAmount >= cost) {
            if(!isPowerSaving) dnaAmount -= cost;
            node.level++;
          }
        }
      });
    }
    updateRender();
  }, 1000);

  centerView();
  updateRender();
</script>
</body>
</html>
